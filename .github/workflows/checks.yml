name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Python behavior checks
        shell: pwsh
        run: |
          python -m unittest settings_smoke agent_smoke -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($test in @('decision_smoke.py', 'adaptive_smoke.py', 'blink_smoke.py', 'camera_scan_smoke.py', 'snap_smoke.py')) {
            python $test
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Parse installer scripts
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'package.ps1', 'deploy-agent.ps1')) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Build native provider
        shell: cmd
        run: build.cmd
